name: Zed - Monk CI vs Blacksmith
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  build:
    name: ${{ matrix.provider }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: Monk CI
            runner: monkci-ubuntu-24.04-32
          - provider: Blacksmith
            runner: blacksmith-32vcpu-ubuntu-2404
    defaults:
      run:
        shell: bash
    env:
      RUSTC_WRAPPER: ""
      RUSTC_WORKSPACE_WRAPPER: ""
    steps:
      - name: Record runner hardware
        run: |
          mkdir -p "$RUNNER_TEMP/benchmark-results"
          { date -u; nproc; lscpu; free -b; df -h; cat /etc/os-release; } > "$RUNNER_TEMP/benchmark-results/hardware.txt"
          cat "$RUNNER_TEMP/benchmark-results/hardware.txt"
          test "$(nproc)" -eq 32
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Record source revisions
        run: |
          { git rev-parse HEAD; git submodule status --recursive; } | tee "$RUNNER_TEMP/benchmark-results/source.txt"
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@1.95.0
      - name: Install dependencies
        working-directory: upstream
        run: ./script/linux
      - name: Build Zed
        working-directory: upstream
        run: /usr/bin/time -v -o "$RUNNER_TEMP/benchmark-results/build-time.txt" cargo build --release --locked
      - name: Publish measurement summary
        if: always()
        env:
          PROVIDER: ${{ matrix.provider }}
        run: |
          {
            echo "## $PROVIDER / Zed"
            echo 'One build; no restored build cache. Queue and setup are separate from build timing.'
            echo '```text'
            cat "$RUNNER_TEMP/benchmark-results/source.txt" 2>/dev/null || true
            cat "$RUNNER_TEMP/benchmark-results/build-time.txt" 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: measurements-${{ matrix.runner }}
          path: ${{ runner.temp }}/benchmark-results/
          retention-days: 30
