  BlackSmith-cacheless:
    name: BlackSmith Cacheless
    runs-on: blacksmith-32vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: upstream
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Dependencies
        run: ./script/linux

      - name: Build
        run: cargo build --release

  github-cacheless:
    name: Github Cacheless
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: upstream
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Dependencies
        run: ./script/linux

      - name: Build
        run: cargo build --release

  monkci-cacheless:
    name: Monk CI Cacheless
    runs-on: monkci-ubuntu-24.04-32
    defaults:
      run:
        working-directory: upstream
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Dependencies
        run: ./script/linux

      - name: Build
        run: cargo build --release
