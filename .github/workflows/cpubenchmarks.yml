# .github/workflows/passmark-cpu-benchmark.yml
#
# Measures the PassMark CPU_SINGLETHREAD score — the exact metric the RunsOn
# leaderboard uses — so your number is directly comparable to the board.
# Runs the same test on your Monk CI runner AND on ubuntu-latest (GitHub's
# baseline) in one go, so you can see the gap side by side.
#
# HOW TO USE:
#   1. Commit this file to .github/workflows/ in any repo in your org.
#   2. Go to the repo's "Actions" tab → "PassMark CPU Benchmark" → "Run workflow".
#   3. Open each job's log and read the CPU_SINGLETHREAD line at the end.
#   4. Run it a few times and take the MEDIAN — cloud CPU scores are noisy,
#      and the leaderboard reports a p50 over 30 days, not a single run.

name: PassMark CPU Benchmark

on:
  workflow_dispatch: {}   # run manually from the Actions tab

jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        # 👇 Replace the first entry with YOUR Monk CI 2-vCPU label.
        #    Keep it at 2 vCPU — that's the standard comparison tier on the board.
        runner:
          - monkci-ubuntu-24.04-2
          - ubuntu-latest
    runs-on: ${{ matrix.runner }}
    name: passmark-${{ matrix.runner }}
    steps:
      - name: Note start time (rough sense of cold-start / queue)
        run: echo "Job started at $(date -u +%H:%M:%S) UTC on ${{ matrix.runner }}"

      - name: Install PassMark dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y unzip wget
          # PassMark still needs the legacy ncurses libs (libtinfo.so.5 /
          # libncurses.so.5), but Ubuntu 24.04 "Noble" dropped those packages.
          # Pull them from the Ubuntu 22.04 "Jammy" archive instead. The version
          # is detected dynamically so this won't break when Ubuntu bumps it.
          POOL="http://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/"
          LIST="$(wget -qO- "$POOL")"
          TINFO="$(echo "$LIST"   | grep -oE 'libtinfo5_[^"]*_amd64\.deb'   | sort -u | tail -1)"
          NCURSES="$(echo "$LIST" | grep -oE 'libncurses5_[^"]*_amd64\.deb' | sort -u | tail -1)"
          echo "Fetching $TINFO and $NCURSES"
          wget -q "${POOL}${TINFO}" "${POOL}${NCURSES}"
          sudo apt-get install -y "./${TINFO}" "./${NCURSES}"

      - name: Download PassMark PerformanceTest (Linux x64)
        run: |
          # If this URL ever 404s, grab the current link from:
          #   https://www.passmark.com/products/pt_linux/download.php
          wget -q https://www.passmark.com/downloads/pt_linux_x64.zip
          # Sanity check: make sure we actually got a zip, not an HTML error page.
          file pt_linux_x64.zip
          unzip -q pt_linux_x64.zip
          echo "Extracted these files:"
          find . -type f \( -name 'PerformanceTest_Linux*' -o -name 'pt_linux*' \) | grep -v '\.zip$' || true

      - name: Locate and run the CPU benchmark
        run: |
          # PassMark renamed the binary (now PerformanceTest_Linux_x86-64) and may
          # rename it again, so match known names and run whatever we find.
          BIN="$(find "$GITHUB_WORKSPACE" -type f \( -name 'PerformanceTest_Linux*' -o -name 'pt_linux_x64' \) 2>/dev/null | head -1)"
          if [ -z "$BIN" ]; then
            echo "Could not find the PassMark binary. Here's what was actually extracted:"
            find "$GITHUB_WORKSPACE" -maxdepth 3 -type f | sort
            exit 1
          fi
          echo "Found binary at: $BIN"
          chmod +x "$BIN"
          PT_DIR="$(dirname "$BIN")"
          BINNAME="$(basename "$BIN")"
          echo "PT_DIR=$PT_DIR" >> "$GITHUB_ENV"   # hand the dir to the next step
          cd "$PT_DIR"
          # PassMark is an ncurses app and CI has no terminal attached, so it fails
          # with "Error opening terminal: unknown". Give it a valid TERM and a
          # pseudo-tty via `script`. `script -e` still fails the job if PassMark errors.
          export TERM=xterm
          # -r 3 (all tests) · -d 3 (long duration) · -debug (headless, no upload prompt)
          script -qec "./$BINNAME -r 3 -d 3 -debug" /dev/null

      - name: Print the single-thread score (compare this to the leaderboard)
        run: |
          cd "$PT_DIR"
          echo "================ RESULT FILES ================"
          ls -la *.yml 2>/dev/null || echo "(no .yml files found in $PT_DIR)"
          echo "================ FULL RESULTS ================"
          cat results_all.yml 2>/dev/null || cat results_cpu.yml 2>/dev/null || true
          echo "=============================================="
          echo ">>> The number that matches the RunsOn 'CPU speed' column:"
          grep -i "CPU_SINGLETHREAD" *.yml 2>/dev/null \
            || echo "CPU_SINGLETHREAD not found — check the file list / results above."

      # ARM RUNNERS: if you also offer arm64, duplicate this workflow and swap
      # pt_linux_x64 -> pt_linux_arm64 (and the matching .zip). You'll also need
      # the arm64 ncurses debs: change "_amd64.deb" to "_arm64.deb" in the
      # dependency step. Then compare against the leaderboard's separate arm64 board.
